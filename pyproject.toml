[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-wsn-routing"
version = "1.0.0"
description = "Energy-aware routing and tabular Q-Learning for simulated wireless sensor networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "networkx>=3.2,<4",
    "pandas>=2.1,<4",
    "matplotlib>=3.8,<4",
    "streamlit>=1.35,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
    "types-networkx>=3.2",
]

[project.scripts]
wsn = "wsn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN", "PL", "PT"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "dashboard", "tests"]
